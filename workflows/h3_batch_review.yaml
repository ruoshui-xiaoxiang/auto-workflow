name: h3_batch_review
description: 每批审核点链（W5b：H3/H4 两道旧闸按 10-23 裁定改成批内四个审核点）。① 提示词包 ② 首帧／参考素材表 ③ 4 步草稿 ④ 成片终审。每个审核点都是 t_gate mode:human：**批准键绑这一批的真实提交参数＋（终审时）媒体内容哈希**，换 seed／步数／强度／模板／素材／成片 ⇒ 指纹变 ⇒ 旧批准不继承；超时不自动放行；按号退回用 --deny。编排登记在 registry.orchestrations.review_pack。
provider: local
args:
  theme: ""
  prompt_file: ""
  ref_images: []
  input_mode: i2va
  prompt_kind: ""
  width: 736
  height: 416
  length: 124
  duration: 5.1667
  steps: 8
  seed: 42
  lora: minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
  lora_strength: 0.7
  head_chunks: 4
  draft_steps: 4
  draft_length: 124
  use_llm_polish: true
  llm_backend: dashscope
steps:
  - task: shell
    id: snapshot
    label: 原稿字节快照（编译前）
    command: py -3.12 -B "{{wf_root}}/../tools/prompt_compile.py" snapshot --source "{{args.prompt_file}}" --out-dir "{{batch_dir}}/prompt_compile" --run-id "{{run_id}}"
    timeout: 120
  - task: llm
    id: translate
    label: 中文自动改写（H3 英文合规）
    hint: 正文含中文时改写成官方骨架英文并写入批次目录编译稿（不回写原稿）
    enabled: "{{args.use_llm_polish}}"
    read_from: "{{args.prompt_file}}"
    write_to: "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    skip_if_no_cjk: true
    backend: "{{args.llm_backend}}"
    system: |-
      你是 H3 提示词合规改写器。输入是一份 H3 官方骨架提示词（正文中混有中文），把它改写成全英文版本并输出。硬性规则：
      1) 首行逐字保留：不要改模式名、时间与 <Picture N> 引用。
      2) 字段名各出现恰一次、顺序不变，字段之间空一行。
      3) 正文保持 [Shot N] 结构，以素材为锚；运镜写成自然英文动词，禁止摄影器材名词。
      4) <d>…</d> 内台词逐字保留原语言；说话人编号写在 <d> 外；引号内画内可见文字保留原文。
      5) 不得缩写、合并、删减信息，不得截断。
      6) 除台词与画内文字外不得残留任何中文字符。
      7) 只输出改写后的完整提示词本身。
    max_tokens: 1500
    temperature: 0.3
  - task: shell
    id: compile_check
    label: 编译稿提交前校验（原稿哈希＋格式/台词/语言/长度）
    command: py -3.12 -B "{{wf_root}}/../tools/prompt_compile.py" verify --source "{{args.prompt_file}}" --state-dir "{{batch_dir}}/prompt_compile" --run-id "{{run_id}}" --compiled "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    timeout: 120
  - task: gate
    id: pre
    mode: auto
    label: 机械预检（不过就停，不打扰人）
    prompt_kind: "{{args.prompt_kind}}"
    input_mode: "{{args.input_mode}}"
    auto_gates: [G1, G2, G3, G4, G5, G6, G7, G8, G11, G13]
    prompt_file: "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    refs: "{{args.ref_images}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    lora: "{{args.lora}}"
    workflow_json: "D:/AIWorkflow/engine/comfy/h3_keyframes_optional_api.json"
  # ── 审核点 ①：提示词包（审的就是要提交的那份编译稿）─────────────────
  - task: gate
    id: RP1
    mode: human
    gate_id: RP1
    label: 审核点①·提示词包
    prompt_file: "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    refs: "{{args.ref_images}}"
    files: "{{args.ref_images}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    lora: "{{args.lora}}"
    seed: "{{args.seed}}"
    steps: "{{args.steps}}"
    lora_strength: "{{args.lora_strength}}"
    input_mode: "{{args.input_mode}}"
    show_prompt: true
    workflow_json: "comfy/h3_keyframes_optional_api.json"
    numbering:
      - "过 = 按这份提示词与这份参数提交"
      - "改<说哪一处> = 改完重新上报（提示词或参数一变，旧批准自动失效）"
      - "否 <理由> = 这条不拍"
  # ── 审核点 ②：首帧／参考素材表 ────────────────────────────────────
  - task: gate
    id: RP2
    mode: human
    gate_id: RP2
    label: 审核点②·首帧／参考素材表
    hint: 素材齐不齐、身份对不对、有没有拿错锚 —— 机检只能量数量与重复，认不出是谁由你看
    files: "{{args.ref_images}}"
    refs: "{{args.ref_images}}"
    seed: "{{args.seed}}"
    steps: "{{args.steps}}"
    input_mode: "{{args.input_mode}}"
    workflow_json: "comfy/h3_keyframes_optional_api.json"
    numbering:
      - "报编号 = 该素材进这批"
      - "退<编号> <理由> = 这条素材退回重做"
  # ── 审核点 ③：4 步草稿（便宜先看一眼动势）─────────────────────────
  - task: video
    id: draft
    label: 4 步草稿（低帧率快速预览）
    workflow: comfy/h3_i2v_fl2va_nolora_api.json
    input_mode: "{{args.input_mode}}"
    prompt_kind: "{{args.prompt_kind}}"
    prompt_file: "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    ref_images: "{{args.ref_images}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.draft_length}}"
    steps: "{{args.draft_steps}}"
    seed: "{{args.seed}}"
    lora: ""
    lora_strength: 0.0
    head_chunks: "{{args.head_chunks}}"
    prefix: "draft_{{run_id}}"
    stage: draft
    timeout: 5400
  - task: gate
    id: RP3
    mode: human
    gate_id: RP3
    label: 审核点③·4 步草稿动势
    videos: "{{draft.files}}"
    files: "{{args.ref_images}}"
    seed: "{{args.seed}}"
    length: "{{args.draft_length}}"
    steps: "{{args.draft_steps}}"
    input_mode: "{{args.input_mode}}"
    workflow_json: "comfy/h3_i2v_fl2va_nolora_api.json"
    numbering:
      - "过 = 动势对，按正式参数提交这一镜"
      - "退<编号> = 这一镜重做（换 seed 或改提示词后旧批准失效）"
  # ── 正式提交 ──────────────────────────────────────────────────────
  - task: video
    id: gen
    label: H3 正式出片
    workflow: comfy/h3_keyframes_optional_api.json
    input_mode: "{{args.input_mode}}"
    prompt_kind: "{{args.prompt_kind}}"
    prompt_file: "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    ref_images: "{{args.ref_images}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    steps: "{{args.steps}}"
    seed: "{{args.seed}}"
    lora: "{{args.lora}}"
    lora_strength: "{{args.lora_strength}}"
    head_chunks: "{{args.head_chunks}}"
    prefix: "rp_{{run_id}}"
    stage: video
    timeout: 10800
  # ── 审核点 ④：成片终审（批准绑媒体哈希，换一条就得重新验收）────────
  - task: gate
    id: RP4
    mode: human
    gate_id: RP4
    label: 审核点④·成片终审
    videos: "{{gen.files}}"
    seed: "{{args.seed}}"
    steps: "{{args.steps}}"
    length: "{{args.length}}"
    input_mode: "{{args.input_mode}}"
    workflow_json: "comfy/h3_keyframes_optional_api.json"
    numbering:
      - "报编号 = 选定交付"
      - "重做 <编号> = 只重跑那一镜（其它已完成镜不重烧）"
