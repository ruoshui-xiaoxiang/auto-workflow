name: h3_i2va_batch
description: H3 fl2va 首帧视频·无人值守批次版。机器预检以本文件 `auto_gates` 声明为准（10-02 起另含 G13 留痕闸）。⚠ 10-19 收口改写：旧那句「与 h3_i2va_video 同图同参，仅去掉 H3／H4 人工门」**实测不成立**，真差异是四处——① 本链 10-21 起**加回** `translate`（中文→官方骨架英文改写，默认开；`--set use_llm_polish=false` 可关）——旧状态是中文正文不改写、G7 在 `--tier play` 档照记放行 ⇒ 直接进模型（实测被当台词念）；② `lora_strength` 本链 1.0（＝验收过基准 v9 的强度）、video 链 0.7（10-14 为压 turbo LoRA 的 identity drift 降的）；③ 本链去掉了 H3／H4 两道人工关口（用户 2026-09-23 授权自主执行、不再人审）；④ 10-19 起 video 链的 H3／H4 才真装回去（此前那条链上根本没有人工门，见 tests/test_gates_phase3 那条一直红着的步骤顺序断言）。**参数一个没动**——本条只把声明改成实话；要真等价得逐项对齐，那是改产物，需另裁。娱乐流面板的「图生视频·锁首帧」10-19 起指本链（用户裁『改指 batch 链』），10-21 后 translate 默认开，面板给中文会被自动改写；要保留中文请 `--set use_llm_polish=false`（draft/final 档会被 G7 拦，play 档才降级放行）。
provider: local
args:
  theme: ""
  prompt_file: ""
  ref_images: []
  # 16GB 显存稳定基线：先用 736x416x124；1344x768 仅手工精品重渲。
  width: 736
  height: 416
  length: 124
  duration: 5.1667
  steps: 8
  seed: 42
  lora: minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
  lora_strength: 1.0
  head_chunks: 4
  # 2026-10-21：加回中文→官方骨架英文改写（与 video 链同一步）；英文稿跳过不调模型。
  use_llm_polish: true
  llm_backend: dashscope
steps:
  - task: llm
    id: translate
    label: 中文自动改写（H3 英文合规）
    hint: 正文含中文时调云端 LLM 改写成官方骨架英文并回写 prompt_file；已是英文则原样放行不调模型
    enabled: "{{args.use_llm_polish}}"
    read_from: "{{args.prompt_file}}"
    write_to: "{{args.prompt_file}}"
    skip_if_no_cjk: true
    backend: "{{args.llm_backend}}"
    system: |-
      你是 H3 I2VA 提示词合规改写器。输入是一份 H3 官方骨架提示词（其 integrated_multimodal_description 正文中混有中文），把它改写成全英文版本并输出。硬性规则：
      1) 首行逐字保留：For the target video, at 0.00 seconds into the target video, <Picture 1> (from [Shot 1]) is fully referenced.
      2) 三个字段名各出现恰一次、顺序不变：integrated_multimodal_description: → overall_soundscape: → non_diegetic_music:；字段之间空一行。
      3) integrated_multimodal_description: 正文以 [Shot 1] 开头，先写画面风格（如 Live-action, cinematic），人物外貌、服装、构图、场景以 <Picture 1> 首帧为锚保持一致，再沿时间线发展动作；运镜写成自然英文动词（Push In / Pan Right / Zoom Out 等），禁止出现摄影器材名词（tripod、dolly、gimbal、crane 等）。
      4) <d>…</d> 内的台词逐字保留原语言不翻译；说话人编号 (S1) 等写在 <d> 外。英文双引号内的画内可见文字保留原文。
      5) overall_soundscape 用 1-4 句英文概括环境声、动作声与非语言人声；non_diegetic_music 用 1-3 句英文写配器、速度、节奏，无配乐写 N/A。
      6) 除台词与画内文字外不得残留任何中文字符。
      7) 只输出改写后的完整提示词本身：不要 markdown 代码块，不要解释，不要任何前后缀。
    max_tokens: 1500
    temperature: 0.3
  - task: gate
    id: pre
    mode: auto
    label: 首帧视频预检
    prompt_kind: h3_i2va
    auto_gates: [G1, G2, G3, G4, G5, G6, G7, G8, G11, G13]
    prompt_file: "{{args.prompt_file}}"
    refs: "{{args.ref_images}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    lora: "{{args.lora}}"
    workflow_json: "D:/AIWorkflow/engine/comfy/h3_i2v_fl2va_api.json"
  - task: video
    id: gen
    label: H3首帧出片(无人值守)
    workflow: comfy/h3_i2v_fl2va_api.json
    prompt_kind: h3_i2va
    prompt_file: "{{args.prompt_file}}"
    ref_images: "{{args.ref_images}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    steps: "{{args.steps}}"
    seed: "{{args.seed}}"
    lora: "{{args.lora}}"
    lora_strength: "{{args.lora_strength}}"
    head_chunks: "{{args.head_chunks}}"
    prefix: "xn_{{run_id}}"
    stage: video
    timeout: 10800
