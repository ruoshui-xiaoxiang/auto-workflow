name: h3_two_pass_daily
description: H3 中性 R3 二采日用链（W4a）。二采是**配方**不是第六种输入模式：pruned INT8 底模＋turbo4 alpha8-T8-convert＋learned latent upscale，base/coarse/refine 步数分开声明（8+4+4），scale_by 必须显式给（日用默认 1.25；2.0 是原 D 档，撞已知崩溃边界要 confirm_big_scale）。Bunny 是**可选增强**：lora2 为空时图上不留 Bunny 节点，给了才挂 5b。模板 comfy/h3_two_pass_api.json 的节点 14 已按已验证 runner（三材两风/00_计划/run_tp_fast.py）重建对齐。与 h3_i2va_batch 一样是无人值守链，产物按 tier 落点；2026-10-24 引擎路径已真跑 P8 R3 1.25（run 20261024_133553_6b4b，576×1024×124→实际 736×1280，315.3s，32kHz2ch）；2.0× 长镜仍未跑。
provider: local
args:
  theme: ""
  prompt_file: ""
  ref_images: []
  input_mode: i2va            # 二采是 recipe，输入模式仍是官方五模式之一
  prompt_kind: ""             # run.py 按 input_mode 派生
  # ── 配方（R3）：与单遍 8 步分开记，不许用"标准 8 步"掩盖真实步数 ──
  two_pass: true
  steps: 8                    # base（第一遍）
  two_pass_coarse_steps: 4    # 二采粗段
  two_pass_refine_steps: 4    # 二采细段
  scale_by: 1.25              # 显式：1.0 不放大／1.25 日用／2.0 原 D 档
  confirm_big_scale: ""       # 2.0 × ≥264 帧要真烧才填 true
  lora: minimax_h3_fl2v_turbo_4step_v0.1_comfyui_alpha8-T8-convert.safetensors
  lora_strength: 1.0
  lora2: ""                   # Bunny 正身；留空＝中性日用
  bunny_strength: 0.5
  # 16GB 显存基线：736x416x124；1344x768 仅手工精品重渲。
  width: 736
  height: 416
  length: 124
  duration: 5.1667
  seed: 42
  head_chunks: 4
  use_llm_polish: true
  llm_backend: dashscope
steps:
  # ── W2 强制编译（与其余 H3 链同构）：原稿不动，编译稿落批次夹，下游只读编译稿 ──
  - task: shell
    id: snapshot
    label: 原稿字节快照（编译前）
    command: py -3.12 -B "{{wf_root}}/../tools/prompt_compile.py" snapshot --source "{{args.prompt_file}}" --out-dir "{{batch_dir}}/prompt_compile" --run-id "{{run_id}}"
    timeout: 120
  - task: llm
    id: translate
    label: 中文自动改写（H3 英文合规）
    hint: 正文含中文时改写成官方骨架英文，写入批次目录的独立编译稿（不回写原稿）；已是英文则原样放行，snapshot 已生成 identity 编译稿
    enabled: "{{args.use_llm_polish}}"
    read_from: "{{args.prompt_file}}"
    write_to: "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    skip_if_no_cjk: true
    backend: "{{args.llm_backend}}"
    system: |-
      你是 H3 提示词合规改写器。输入是一份 H3 官方骨架提示词（正文中混有中文），把它改写成全英文版本并输出。硬性规则：
      1) 首行逐字保留：不要改模式首行里的模式名、时间与 <Picture N> 引用。
      2) 三个字段名各出现恰一次、顺序不变：integrated_multimodal_description: → overall_soundscape: → non_diegetic_music:；字段之间空一行。
      3) integrated_multimodal_description: 正文保持 [Shot N] 结构；以首帧为锚保持一致，再沿时间线发展动作；运镜写成自然英文动词，禁止摄影器材名词（tripod、dolly、gimbal、crane 等）。
      4) <d>…</d> 内的台词逐字保留原语言不翻译；说话人编号写在 <d> 外；英文双引号内的画内可见文字保留原文。
      5) overall_soundscape 用 1-4 句英文；non_diegetic_music 用 1-3 句英文写配器、速度、节奏，无配乐写 N/A。
      6) 除台词与画内文字外不得残留任何中文字符。
      7) 只输出改写后的完整提示词本身：不要 markdown 代码块，不要解释，不要任何前后缀。
    max_tokens: 1500
    temperature: 0.3
  - task: shell
    id: compile_check
    label: 编译稿提交前校验（原稿哈希＋格式/台词/语言/长度）
    command: py -3.12 -B "{{wf_root}}/../tools/prompt_compile.py" verify --source "{{args.prompt_file}}" --state-dir "{{batch_dir}}/prompt_compile" --run-id "{{run_id}}" --compiled "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    timeout: 120
  - task: gate
    id: pre
    mode: auto
    label: 二采出片预检
    prompt_kind: "{{args.prompt_kind}}"
    input_mode: "{{args.input_mode}}"
    auto_gates: [G1, G2, G3, G4, G5, G6, G7, G8, G11, G13]
    prompt_file: "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    refs: "{{args.ref_images}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    lora: "{{args.lora}}"
    workflow_json: "D:/AIWorkflow/engine/comfy/h3_two_pass_api.json"
  - task: video
    id: gen
    label: H3 中性 R3 二采出片
    hint: 单遍 t_video 复用同一套预检/轮询/QC/归档；二采只是这张图多了 4+4 与放大段
    workflow: comfy/h3_two_pass_api.json
    input_mode: "{{args.input_mode}}"
    prompt_kind: "{{args.prompt_kind}}"
    two_pass: "{{args.two_pass}}"
    scale_by: "{{args.scale_by}}"
    confirm_big_scale: "{{args.confirm_big_scale}}"
    two_pass_coarse_steps: "{{args.two_pass_coarse_steps}}"
    two_pass_refine_steps: "{{args.two_pass_refine_steps}}"
    prompt_file: "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    ref_images: "{{args.ref_images}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    steps: "{{args.steps}}"
    seed: "{{args.seed}}"
    lora: "{{args.lora}}"
    lora_strength: "{{args.lora_strength}}"
    lora2: "{{args.lora2}}"
    lora2_strength: "{{args.bunny_strength}}"
    bunny_strength: "{{args.bunny_strength}}"
    head_chunks: "{{args.head_chunks}}"
    prefix: "h3tp_{{run_id}}"
    stage: video
    timeout: 14400
