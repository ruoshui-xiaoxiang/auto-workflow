name: h3_fl2va_fight_play
description: 通道4「跑着玩」打斗档：fl2va 锁首帧 + 8 步 turbo + 内容 LoRA（Bunny_weapon 0.5），走双 LoRA 模板。跑前自审(G, auto) → 直接出片，无人工关口、不发飞书。
provider: local
# ---------------------------------------------------------------------------
# 模板 comfy/h3_i2v_fl2va_dual_lora.json（引擎里现成，链路基序＝底模→Turbo(__LORA__)→
# 内容(__LORA2__)→Attention），槽位仍是 1 张＝首帧。
# ⚠ Bunny_weapon_combatV1.safetensors 是**别人在生产 profile fight_fast8 里在用的**内容 LoRA，
#   本文件只是复用，不改它的任何配置；也不挂 wushu_spatial_physics（那条在 D:\AIWorkflow
#   全仓零引用，来历未核，别顺手加）。
# ---------------------------------------------------------------------------
args:
  theme: "play · 打斗8步"
  prompt_file: ""
  width: 864
  height: 1536
  length: 124
  duration: 5.1667
  steps: 8
  seed: 42
  lora: minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
  lora_strength: 1.0
  lora2: Bunny_weapon_combatV1.safetensors
  lora2_strength: 0.5
  head_chunks: 4
  ref_images: []           # 必须正好 1 张（首帧）
  use_llm_polish: false
  llm_backend: dashscope
  enable_audio: true
  resolution_tier: draft
steps:
  - task: gate
    id: pre
    mode: auto
    label: 跑前自审（打斗档）
    auto_gates: [G1, G2, G3, G4, G5, G6, G7, G8, G11, G13]
    prompt_kind: h3_i2va
    prompt_file: "{{args.prompt_file}}"
    refs: "{{args.ref_images}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    lora: "{{args.lora}}"
    workflow_json: "comfy/h3_i2v_fl2va_dual_lora.json"

  - task: video
    id: gen
    label: H3 出片（首帧 · 8 步 turbo + 武器内容 LoRA）
    workflow: "comfy/h3_i2v_fl2va_dual_lora.json"
    prompt_kind: h3_i2va
    prompt_file: "{{args.prompt_file}}"
    ref_images: "{{args.ref_images}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    steps: "{{args.steps}}"
    seed: "{{args.seed}}"
    lora: "{{args.lora}}"
    lora_strength: "{{args.lora_strength}}"
    lora2: "{{args.lora2}}"
    lora2_strength: "{{args.lora2_strength}}"
    head_chunks: "{{args.head_chunks}}"
    prefix: "h3fight_{{run_id}}"
    stage: "video"
    timeout: 10800
