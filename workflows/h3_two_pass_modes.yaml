name: h3_two_pass_modes
description: R3 二采 × 官方五模式的统一链（W4c）。模板 comfy/h3_two_pass_modes_api.json 由 comfy/h3_two_pass_api.json（已验证节点 14）派生，差别是把条件化模式名换成 __TASK_TYPE__、首尾帧与参考槽改为按实际素材动态注入（_meta.keyframes_optional＋dynamic_reference_slots）—— 所以 input_mode=t2va/i2va/fl2va/l2va/ref2va 走同一张二采图，不再"每模式复制同构图"。二采仍是**配方**不是模式：base/coarse/refine 与 scale_by 分开声明，Bunny 只在 lora2 非空时挂。原 h3_two_pass_api.json／h3_two_pass_daily.yaml 保留不动，作为已验证 I2VA 单图口径的兼容路径。
provider: local
args:
  theme: ""
  prompt_file: ""
  ref_images: []
  ref_videos: []
  ref_video_audios: []
  ref_audios: []
  input_mode: i2va            # t2va / i2va / l2va / fl2va / ref2va
  prompt_kind: ""             # run.py 按 input_mode 派生
  two_pass: true
  steps: 8
  two_pass_coarse_steps: 4
  two_pass_refine_steps: 4
  scale_by: 1.25
  confirm_big_scale: ""
  lora: minimax_h3_fl2v_turbo_4step_v0.1_comfyui_alpha8-T8-convert.safetensors
  lora_strength: 1.0
  lora2: ""
  bunny_strength: 0.5
  width: 736
  height: 416
  length: 124
  duration: 5.1667
  seed: 42
  head_chunks: 4
  use_llm_polish: true
  llm_backend: dashscope
steps:
  - task: shell
    id: snapshot
    label: 原稿字节快照（编译前）
    command: py -3.12 -B "{{wf_root}}/../tools/prompt_compile.py" snapshot --source "{{args.prompt_file}}" --out-dir "{{batch_dir}}/prompt_compile" --run-id "{{run_id}}"
    timeout: 120
  - task: llm
    id: translate
    label: 中文自动改写（H3 英文合规）
    hint: 正文含中文时改写成官方骨架英文（Ref2VA 改六段），写入批次目录编译稿，不回写原稿
    enabled: "{{args.use_llm_polish}}"
    read_from: "{{args.prompt_file}}"
    write_to: "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    skip_if_no_cjk: true
    backend: "{{args.llm_backend}}"
    system: |-
      你是 H3 提示词合规改写器。输入是一份 H3 官方提示词（正文中混有中文），改写成全英文并输出。硬性规则：
      1) 首行逐字保留：不要改模式名、时间与 <Picture N>/<Video N>/<Audio N> 引用。
      2) 字段名各出现恰一次、顺序不变（骨架三字段或 Ref2VA 六段），字段之间空一行。
      3) 正文保持 [Shot N] 结构与切点时间码；以素材为锚；运镜写成自然英文动词，禁止摄影器材名词。
      4) <d>…</d> 内台词逐字保留原语言；说话人编号写在 <d> 外；引号内画内可见文字保留原文。
      5) 不得缩写、合并、删减信息，不得截断，输出必须完整到最后一个字段。
      6) 除台词与画内文字外不得残留任何中文字符。
      7) 只输出改写后的完整提示词本身：不要 markdown 代码块，不要解释，不要任何前后缀。
    max_tokens: 1500
    temperature: 0.3
  - task: shell
    id: compile_check
    label: 编译稿提交前校验（原稿哈希＋格式/台词/语言/长度）
    command: py -3.12 -B "{{wf_root}}/../tools/prompt_compile.py" verify --source "{{args.prompt_file}}" --state-dir "{{batch_dir}}/prompt_compile" --run-id "{{run_id}}" --compiled "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    timeout: 120
  - task: gate
    id: pre
    mode: auto
    label: R3 全模式预检
    prompt_kind: "{{args.prompt_kind}}"
    input_mode: "{{args.input_mode}}"
    auto_gates: [G1, G2, G3, G4, G5, G6, G7, G8, G11, G13]
    prompt_file: "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    refs: "{{args.ref_images}}"
    ref_videos: "{{args.ref_videos}}"
    ref_video_audios: "{{args.ref_video_audios}}"
    ref_audios: "{{args.ref_audios}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    lora: "{{args.lora}}"
    workflow_json: "D:/AIWorkflow/engine/comfy/h3_two_pass_modes_api.json"
  - task: video
    id: gen
    label: R3 二采出片（按模式接帧/素材槽）
    workflow: comfy/h3_two_pass_modes_api.json
    input_mode: "{{args.input_mode}}"
    prompt_kind: "{{args.prompt_kind}}"
    two_pass: "{{args.two_pass}}"
    scale_by: "{{args.scale_by}}"
    confirm_big_scale: "{{args.confirm_big_scale}}"
    two_pass_coarse_steps: "{{args.two_pass_coarse_steps}}"
    two_pass_refine_steps: "{{args.two_pass_refine_steps}}"
    prompt_file: "{{batch_dir}}/prompt_compile/compiled_{{run_id}}.txt"
    ref_images: "{{args.ref_images}}"
    ref_videos: "{{args.ref_videos}}"
    ref_video_audios: "{{args.ref_video_audios}}"
    ref_audios: "{{args.ref_audios}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    steps: "{{args.steps}}"
    seed: "{{args.seed}}"
    lora: "{{args.lora}}"
    lora_strength: "{{args.lora_strength}}"
    lora2: "{{args.lora2}}"
    lora2_strength: "{{args.bunny_strength}}"
    bunny_strength: "{{args.bunny_strength}}"
    head_chunks: "{{args.head_chunks}}"
    prefix: "h3tpm_{{run_id}}"
    stage: video
    timeout: 14400
