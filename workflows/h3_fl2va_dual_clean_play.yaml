name: h3_fl2va_dual_clean_play
description: 通道4「跑着玩」精细档两头夹：fl2va 首帧＋尾帧（官方 FL2VA 首行）+ **20 步、不挂 LoRA**。跑前自审(G, auto) → 直接出片，无人工关口、不发飞书。
provider: local
# 与 h3_fl2va_clean_play 同一条 LoRA 口径（模板 comfy/h3_i2v_fl2va_dual_nolora_api.json，
# 槽位＝2：第 1 张 first_frame、第 2 张 last_frame）。
args:
  theme: "play · 精细20步两头夹"
  prompt_file: ""
  width: 864
  height: 1536
  length: 124
  duration: 5.1667
  steps: 20
  seed: 42
  lora: ""
  lora_strength: 1.0
  head_chunks: 4
  ref_images: []           # 必须正好 2 张（首帧、尾帧）
  use_llm_polish: false
  llm_backend: dashscope
  enable_audio: true
  resolution_tier: draft
steps:
  - task: gate
    id: pre
    mode: auto
    label: 跑前自审（精细档·两头夹）
    auto_gates: [G1, G2, G3, G4, G5, G6, G7, G8, G11, G13]
    prompt_kind: h3_fl2va
    prompt_file: "{{args.prompt_file}}"
    refs: "{{args.ref_images}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    lora: "{{args.lora}}"
    workflow_json: "comfy/h3_i2v_fl2va_dual_nolora_api.json"

  - task: video
    id: gen
    label: H3 出片（首帧＋尾帧 · 20 步无 LoRA）
    workflow: "comfy/h3_i2v_fl2va_dual_nolora_api.json"
    prompt_kind: h3_fl2va
    prompt_file: "{{args.prompt_file}}"
    ref_images: "{{args.ref_images}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    length: "{{args.length}}"
    steps: "{{args.steps}}"
    seed: "{{args.seed}}"
    head_chunks: "{{args.head_chunks}}"
    prefix: "h3dualclean_{{run_id}}"
    stage: "video"
    timeout: 10800
