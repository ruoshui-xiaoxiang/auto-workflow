# ==== 10-02 批1 追加（写在文件末尾是故意的，别往上挪）==========================
# 上面 `preflight:` 那一段注释里有一句「09-28 03:31 实测：tests/ 107 项全过」。
# 勘误追加在这儿，不写在它旁边——因为往那个键上方插任何行数，都会把 `:71` 这个
# 被规则层按行号引用的锚推走（本次试写 2 行就把 preflight 从 :71 推到了 :73，
# 已回退）。这正是登记表 C8 记过的那类病：**行号是脆的，键名才是稳的**。
#
# ① 「107 项」这个数：**单位是用例数，不是函数个数**。
#    `def test_` 静态只能数到 74 个函数，@parametrize 会一对多展开成 108 条用例。
#    拿 74 去对 107 是单位错配（`scan_system.py` 第一版就犯过，已改成现跑
#    `pytest --collect-only` 取用例数）。
# ② **这里不写实跑数**。10-02 一度写过「108 项」又写过「114 项」，两次都在加完新用例后
#    当场变陈旧 —— 手写实测值进配置就会漂，跟"引用配置项写键名不写行号"是同一条纪律。
#    要现在的数：`cd /d D:\AIWorkflow\engine` 后跑 `py -3.12 -m pytest tests -q`，
#    或看 `E:\若水AI电影\system_manifest.json` 的 `engine.tests.collected_cases`（扫描器现算）。
# ③ 本段只保留一条不会过期的信息：注释里那个「107 项」的**单位**是用例数，不是函数个数。


