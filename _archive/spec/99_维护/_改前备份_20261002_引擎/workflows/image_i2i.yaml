name: image_i2i
description: 图生图 —— 保输入图的构图/机位，按提示词重画风格、材质与细节。denoise 是唯一刻度：0.2~0.4 保构图（实测 0.30 构图相关 0.833），0.6 起等于重画（实测掉到 0.571）。
args:
  # 初始化图。留空则跑不起来（control 步骤会明确报错，不会白烧 GPU）。
  src_image: ""
  # 例：'E:\创作\武昭君仪\打戏练习件_长枪vs义体腿\首帧\P3A_双人站位_首帧_736x416.png'
  prompt: ""
  # 例："赛博朋克雨夜长巷，左侧持长枪的女子弓步前刺，右侧人形机甲挥拳，霓虹灯牌、蒸汽、湿地面反光，电影感写实CG"
  # ⚠️ denoise 刻度（2026-09-28 同帧实测）：
  #   0.20~0.30 → 只换画风/材质，构图与姿态基本不动（要"同构图变体"用这档）
  #   0.45~0.55 → 构图开始漂（人物位置会挪）
  #   0.60+     → 实测直接换成另一个场景，等于重画
  denoise: 0.3
  # width/height 只喂"跑前自审"（G5 分辨率口径）；i2i 的实际尺寸由 src_image 决定
  width: 736
  height: 416
  steps: 20
  seed: ""
steps:
  - task: gate
    id: pre
    mode: auto
    label: 跑前自审（机制关口）
    hint: 图片口径：分辨率/字面化词/落点；锁脸铁律由 i2i 锚点那条链把守，本流可裸文字
    auto_gates: [G5, G7, G11]
    prompt_kind: image
    characters: none
    width: "{{args.width}}"
    height: "{{args.height}}"
    prompt: "{{args.prompt}}"
    refs: "{{args.src_image}}"

  - task: control
    id: gen
    label: 图生图（保构图重绘）
    hint: denoise 0.2~0.4 换画风不改构图；0.6 起等于重画。产物落批次夹 i2i/
    workflow: "comfy/flux_i2i_api.json"
    prompt: "{{args.prompt}}"
    src_image: "{{args.src_image}}"
    width: "{{args.width}}"
    height: "{{args.height}}"
    steps: "{{args.steps}}"
    denoise: "{{args.denoise}}"
    seed: "{{args.seed}}"
    prefix: "i2i_{{run_id}}"
    stage: "i2i"
    timeout: 900
