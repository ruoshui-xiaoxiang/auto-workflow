<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>繁星系统 · 启动台</title>
<style>
  :root {
    --bg:#05090e; --panel:#0a131c; --panel-2:#0d1721; --line:#1b2836; --line-2:#28384a;
    --fg:#e9eff6; --fg-2:#c2cfdb; --muted:#8597a7;
    --accent:#5eead4; --accent-2:#38bdf8; --green:#3ddc97; --amber:#f5b955; --red:#ff6b6b;
    --font-sans:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    --font-mono:"Cascadia Code","Consolas",monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:
      radial-gradient(900px 500px at 15% -10%, rgba(94,234,212,.09), transparent 60%),
      radial-gradient(700px 400px at 95% 0%, rgba(56,189,248,.08), transparent 55%),
      var(--bg);
    color:var(--fg); font:13px/1.6 var(--font-sans);
  }
  .wrap { max-width:1100px; margin:0 auto; padding:28px 20px 60px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:26px; }
  .brand { display:flex; align-items:center; gap:11px; }
  .mark { width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
          border:1px solid rgba(94,234,212,.32); background:rgba(94,234,212,.08); color:var(--accent); }
  .mark svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; }
  .title { font-size:18px; font-weight:650; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .nav { display:flex; gap:8px; }
  .btn { display:inline-flex; align-items:center; height:32px; padding:0 12px; border-radius:9px;
         border:1px solid var(--line-2); background:var(--panel); color:var(--fg-2);
         text-decoration:none; font:inherit; cursor:pointer; }
  .btn:hover { color:var(--fg); border-color:rgba(94,234,212,.5); }
  .btn.primary { color:#04211d; background:var(--accent); border-color:var(--accent); font-weight:650; }
  .intro { color:var(--muted); max-width:760px; margin:0 0 22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
  .card { background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--line);
          border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px;
          min-height:154px; box-shadow:0 24px 60px -50px #000; }
  .card-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .name { font-size:15px; font-weight:650; }
  .kind { font:10px var(--font-mono); color:var(--muted); border:1px solid var(--line-2);
          border-radius:999px; padding:2px 7px; text-transform:uppercase; }
  .note { color:var(--fg-2); font-size:12px; flex:1; }
  .path { color:var(--muted); font:10.5px var(--font-mono); word-break:break-all; }
  .card .btn { align-self:flex-start; }
  .status { min-height:22px; color:var(--muted); font-size:12px; margin-top:14px; }
  .status.ok { color:var(--green); }
  .status.bad { color:var(--red); }
  @media (max-width:560px) { .wrap { padding:20px 13px 40px; } .nav { width:100%; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 3.2 13.9 9 19.8 10.9 13.9 12.8 12 18.7 10.1 12.8 4.2 10.9 10.1 9Z"/><path d="M18.6 4.4v2.6M17.3 5.7h2.6"/><circle cx="5.4" cy="18.6" r="1.1"/></svg></div>
      <div><div class="title">繁星系统 · 启动台</div><div class="sub">Launcher / Local only</div></div>
    </div>
    <nav class="nav">
      <a class="btn" href="/">工作台</a>
      <a class="btn" href="/map3d">3D 星图</a>
    </nav>
  </header>

  <p class="intro">这些是你原来放在桌面的自建入口。现在统一从这里启动；只打开白名单里的程序/目录，不接受任意路径。</p>
  <div id="grid" class="grid"></div>
  <div id="status" class="status"></div>
</div>

<script>
(function () {
  "use strict";
  var grid = document.getElementById("grid");
  var statusEl = document.getElementById("status");
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function setStatus(text, cls) {
    statusEl.textContent = text || "";
    statusEl.className = "status" + (cls ? " " + cls : "");
  }
  async function load() {
    try {
      var r = await fetch("/api/launchpad", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      var data = await r.json();
      var entries = data.entries || [];
      if (!entries.length) {
        grid.innerHTML = '<div class="card"><div class="name">未配置启动项</div><div class="note">在 fanxing/launchpad.json 里添加白名单入口。</div></div>';
        return;
      }
      grid.innerHTML = entries.map(function (e) {
        return '<article class="card" data-id="' + esc(e.id) + '">' +
          '<div class="card-head"><div class="name">' + esc(e.name) + '</div>' +
          '<span class="kind">' + esc(e.kind === "bat" ? "程序" : "目录") + '</span></div>' +
          '<div class="note">' + esc(e.note || "") + '</div>' +
          '<div class="path">' + esc(e.target || "") + '</div>' +
          '<button class="btn primary" type="button" data-launch="' + esc(e.id) + '">' +
          (e.kind === "bat" ? "启动" : "打开") + '</button></article>';
      }).join("");
      grid.querySelectorAll("[data-launch]").forEach(function (btn) {
        btn.addEventListener("click", function () { launch(btn.getAttribute("data-launch"), btn); });
      });
    } catch (err) {
      grid.innerHTML = '<div class="card"><div class="name">启动台不可用</div><div class="note">' + esc(err.message) + '</div></div>';
      setStatus("读取 /api/launchpad 失败", "bad");
    }
  }
  async function launch(id, btn) {
    var old = btn.textContent;
    btn.disabled = true;
    btn.textContent = "处理中…";
    setStatus("");
    try {
      var r = await fetch("/api/launch", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Fanxing-Launch": "1" },
        body: JSON.stringify({ id: id })
      });
      var data = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
      setStatus("已启动：" + (data.name || id), "ok");
    } catch (err) {
      setStatus("启动失败：" + err.message, "bad");
    } finally {
      btn.disabled = false;
      btn.textContent = old;
    }
  }
  load();
})();
</script>
</body>
</html>
