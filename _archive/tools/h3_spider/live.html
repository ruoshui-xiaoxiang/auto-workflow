<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b141d'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%235eead4' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%235eead4'/%3E%3C/svg%3E">
<title>繁星系统 · 实时审查</title>
<style>
  :root {
    --bg:#05090e; --panel:#0a131c; --panel-2:#0d1721; --line:#1b2836; --line-2:#28384a;
    --fg:#e9eff6; --fg-2:#c2cfdb; --muted:#8597a7; --accent:#5eead4; --accent-2:#38bdf8;
    --green:#3ddc97; --amber:#f5b955; --red:#ff6b6b; --purple:#b794f6;
    --font-sans:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    --font-mono:"Cascadia Code","Consolas",monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:
      radial-gradient(900px 500px at 10% -10%, rgba(94,234,212,.08), transparent 60%),
      radial-gradient(700px 400px at 100% 0%, rgba(56,189,248,.07), transparent 55%),
      var(--bg); color:var(--fg); font:13px/1.55 var(--font-sans); }
  .wrap { max-width:1500px; margin:0 auto; padding:16px 18px 40px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .mark { width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
          border:1px solid rgba(94,234,212,.32); background:rgba(94,234,212,.08); color:var(--accent); }
  .mark svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; }
  .title { font-size:16px; font-weight:650; } .sub { color:var(--muted); font-size:10px; letter-spacing:.1em; }
  .nav { display:flex; gap:7px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; height:30px; padding:0 10px; border-radius:8px;
         border:1px solid var(--line-2); background:var(--panel); color:var(--fg-2); text-decoration:none;
         font:inherit; font-size:11.5px; cursor:pointer; }
  .btn:hover { color:var(--fg); border-color:rgba(94,234,212,.5); }
  .pill { display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 9px;
          border-radius:999px; border:1px solid var(--line-2); color:var(--fg-2); font-size:11px; }
  .pill.ok { color:var(--green); border-color:rgba(61,220,151,.4); }
  .pill.bad { color:var(--red); border-color:rgba(255,107,107,.45); }
  .pill.warn { color:var(--amber); border-color:rgba(245,185,85,.4); }
  .layout { display:grid; grid-template-columns:220px minmax(0,1fr); gap:12px; }
  aside { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px; height:fit-content; }
  .eyebrow { color:var(--muted); font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
  .shots { display:flex; flex-direction:column; gap:5px; margin-top:8px; }
  .shot { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:7px 8px;
          border-radius:8px; border:1px solid transparent; color:var(--fg-2); cursor:pointer; font-size:12px; }
  .shot:hover { background:var(--panel-2); border-color:var(--line-2); }
  .shot.active { background:rgba(94,234,212,.10); border-color:rgba(94,234,212,.4); color:var(--fg); }
  .shot .st { font:10px var(--font-mono); color:var(--muted); }
  main { min-width:0; display:flex; flex-direction:column; gap:12px; }
  .bar { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 13px; }
  .panel h3 { margin:0 0 8px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .stats { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
  .stat { background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .stat .k { color:var(--muted); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
  .stat .v { font:650 20px var(--font-mono); margin-top:2px; }
  .stat .v.green { color:var(--green); } .stat .v.amber { color:var(--amber); }
  .stat .v.red { color:var(--red); } .stat .v.purple { color:var(--purple); }
  .banner { display:none; padding:8px 10px; border-radius:9px; font-size:12px; margin-bottom:8px; }
  .banner.on { display:block; }
  .banner.red { color:var(--red); background:rgba(255,107,107,.09); border:1px solid rgba(255,107,107,.35); }
  .banner.amber { color:var(--amber); background:rgba(245,185,85,.08); border:1px solid rgba(245,185,85,.3); }
  .banner.ok { color:var(--green); background:rgba(61,220,151,.07); border:1px solid rgba(61,220,151,.3); }
  table { width:100%; border-collapse:collapse; font-size:11.5px; }
  .table-wrap { width:100%; max-width:100%; overflow-x:auto; }
  .table-wrap table { min-width:520px; }
  th, td { padding:6px 7px; border-top:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; }
  .mono { font-family:var(--font-mono); }
  .chip { display:inline-flex; align-items:center; height:19px; padding:0 6px; border-radius:999px;
          border:1px solid var(--line-2); color:var(--fg-2); font-size:10px; white-space:nowrap; }
  .chip.ok { color:var(--green); border-color:rgba(61,220,151,.4); }
  .chip.bad { color:var(--red); border-color:rgba(255,107,107,.4); }
  .chip.warn { color:var(--amber); border-color:rgba(245,185,85,.4); }
  .chip.na { color:var(--muted); border-style:dashed; }
  .chip.unv { color:var(--muted); border-color:var(--line-2); }
  .node-state { font-size:10.5px; }
  .node-state.injected { color:var(--muted); }
  .node-state.seen { color:#38bdf8; }
  .node-state.recovered, .node-state.ok { color:var(--green); }
  .node-state.missing, .node-state.skipped_by_capability { color:var(--amber); }
  .node-state.tampered, .node-state.wrong_leg, .node-state.mismatch { color:var(--red); }
  .events { max-height:230px; overflow:auto; font:10.5px/1.6 var(--font-mono); color:var(--fg-2); }
  .ev { display:grid; grid-template-columns:42px 44px 58px 1fr; gap:6px; padding:3px 0; border-top:1px solid var(--line); }
  .ev .muted { color:var(--muted); }
  .ev .err-mut { color:var(--amber); }
  .ev .err-clean { color:var(--red); }
  .muted { color:var(--muted); }
  .small { font-size:11px; }
  @media (max-width:900px) {
    .layout { grid-template-columns:1fr; }
    aside { order:2; }
    .stats { grid-template-columns:repeat(2,1fr); }
    .events { max-height:180px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 3.2 13.9 9 19.8 10.9 13.9 12.8 12 18.7 10.1 12.8 4.2 10.9 10.1 9Z"/><path d="M18.6 4.4v2.6M17.3 5.7h2.6"/><circle cx="5.4" cy="18.6" r="1.1"/></svg></div>
      <div><div class="title">繁星系统 · 实时审查</div><div class="sub">LIVE RECOVERY / SSE</div></div>
    </div>
    <nav class="nav">
      <a class="btn" href="/">工作台</a>
      <a class="btn" href="/map3d">3D 星图</a>
      <a class="btn" href="/live">实时</a>
      <a class="btn" href="/launch">启动台</a>
    </nav>
  </header>

  <div class="layout">
    <aside>
      <div class="eyebrow">SHOTS</div>
      <div id="shots" class="shots"></div>
    </aside>
    <main>
      <div class="bar">
        <span id="shot-pill" class="pill">—</span>
        <span id="status-pill" class="pill">等待</span>
        <span id="overall-pill" class="pill">—</span>
        <span id="snap-pill" class="pill">0 EVENTS</span>
        <span id="mode-pill" class="pill">hybrid</span>
      </div>
      <div id="banner" class="banner"></div>
      <section class="panel">
        <div class="stats">
          <div class="stat"><div class="k">NODES SEEN</div><div class="v" id="k-seen">0</div></div>
          <div class="stat"><div class="k">MISSING</div><div class="v amber" id="k-missing">0</div></div>
          <div class="stat"><div class="k">TAMPERED</div><div class="v red" id="k-tampered">0</div></div>
          <div class="stat"><div class="k">UNVERIFIED</div><div class="v" id="k-unverified">0</div></div>
          <div class="stat"><div class="k">CANARY</div><div class="v green" id="k-canary">—</div></div>
        </div>
      </section>
      <section class="panel">
        <h3>LEG MATRIX <span class="small muted" id="matrix-note"></span></h3>
        <div class="small muted" style="margin-bottom:6px">MUT ERR = 坏样本预期报错 n / M（绿=全命中；琥珀=漏报；红=多报）。CLEAN ERR 必须为 0。</div>
        <div id="matrix"></div>
      </section>
      <section class="panel">
        <h3>NODE RECOVERY <span class="small muted" id="node-note"></span></h3>
        <div id="nodes"></div>
      </section>
      <section class="panel">
        <h3>EVENTS <span class="small muted">最近 60 条快照</span></h3>
        <div id="events" class="events"></div>
      </section>
    </main>
  </div>
</div>

<script>
(function () {
  "use strict";
  var state = { batch: null, sid: null, shot: null, es: null, snaps: 0,
                seen: {}, leg: {}, counts: { missing:0, tampered:0, unverified:0 },
                events: [], verdict: null, timer: null };
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function chip(text, cls) { return '<span class="chip ' + (cls || "") + '">' + esc(text) + '</span>'; }
  function setPill(id, text, cls) { var e=el(id); e.textContent=text; e.className="pill " + (cls||""); }
  function short(s, n) { s=String(s||""); return s.length>n ? s.slice(0,n)+"…" : s; }

  async function getJSON(url) { var r=await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); }

  function renderShots() {
    var recs=(state.batch && state.batch.shots) || {};
    var ids=Object.keys(recs).sort();
    el("shots").innerHTML = ids.map(function (sid) {
      var v=(recs[sid]||{})["verdict.json"]||{};
      var c=v.canary||{};
      return '<div class="shot' + (sid===state.sid?" active":"") + '" data-sid="' + esc(sid) + '">' +
        '<span>' + esc(sid) + '</span><span class="st">' + esc(v.overall || "—") + ' · ' + (c.mutant_errors||0) + '/' + (c.expected_mutants||0) + '</span></div>';
    }).join("");
    el("shots").querySelectorAll("[data-sid]").forEach(function (x) {
      x.addEventListener("click", function () { openShot(x.getAttribute("data-sid")); });
    });
  }

  async function loadBatch() {
    try { state.batch=await getJSON("/api/batch"); renderShots(); } catch(e) {}
  }

  function legInit() {
    state.leg = {};
    ["L1","L2","L3","L4","L5","L6","L7","L8"].forEach(function (l) {
      state.leg[l] = {T:0,M:0,C:0,checked:0,errClean:0,errMut:0,seen:{}};
    });
    (state.shot["manifest.json"] && state.shot["manifest.json"].nodes || []).forEach(function (n) {
      var l=state.leg[n.leg] || (state.leg[n.leg]={T:0,M:0,C:0,checked:0,errClean:0,errMut:0,seen:{}});
      l[n.kind]=(l[n.kind]||0)+1;
    });
  }

  function reset() {
    state.snaps=0; state.seen={}; state.events=[]; state.verdict=null;
    state.counts={missing:0,tampered:0,unverified:0};
    legInit(); renderAll();
  }

  function openShot(sid) {
    if (state.es) { state.es.close(); state.es=null; }
    state.sid=sid;
    getJSON("/api/shot?sid="+encodeURIComponent(sid)).then(function (s) {
      state.shot=s;
      reset();
      setPill("shot-pill", sid, "ok");
      setPill("status-pill", "连接中…", "warn");
      setPill("overall-pill", "—", "");
      var m=s["manifest.json"]||{};
      el("mode-pill").textContent=(m.mode || "—") + " · " + (m.tokenizer || "");
      el("snap-pill").textContent="0 EVENTS";
      renderShots();
      connect(sid);
    }).catch(function (e) { el("banner").className="banner red on"; el("banner").textContent="读取镜头失败："+e.message; });
  }

  function connect(sid) {
    if (!window.EventSource) {
      el("banner").className="banner amber on"; el("banner").textContent="浏览器不支持 EventSource；请打开工作台查看已完成结果。";
      return;
    }
    state.es=new EventSource("/api/live?sid="+encodeURIComponent(sid));
    state.es.addEventListener("status", function (ev) {
      try {
        var st=JSON.parse(ev.data);
        setPill("status-pill", st.status || "running", st.status==="done" ? "ok" : "warn");
      } catch(e) {}
    });
    state.es.addEventListener("snapshot", function (ev) {
      try {
        var s=JSON.parse(ev.data);
        state.snaps++;
        var lg=state.leg[s.leg] || (state.leg[s.leg]={T:0,M:0,C:0,checked:0,errClean:0,errMut:0,seen:{}});
        lg.checked++;
        if (s.status==="error") {
          if (s.variant==="clean") lg.errClean++; else lg.errMut++;
        }
        (s.node_ids||[]).forEach(function (id) { state.seen[id]=true; lg.seen[id]=true; });
        state.events.push({leg:s.leg,variant:s.variant,status:s.status,code:s.code,text:s.text});
        if (state.events.length>60) state.events.shift();
        schedule();
      } catch(e) {}
    });
    state.es.addEventListener("verdict", function (ev) {
      try { state.verdict=JSON.parse(ev.data); state.es.close(); state.es=null;
            setPill("status-pill","done","ok"); schedule(); } catch(e) {}
    });
    state.es.onerror=function () {
      if (!state.verdict) setPill("status-pill","重连中…","warn");
    };
  }

  function schedule() {
    if (state.timer) return;
    state.timer=setTimeout(function () { state.timer=null; renderAll(); }, 180);
  }

  function verdictNode(n) {
    if (!state.verdict) return null;
    return (state.verdict.nodes||[]).find(function (x) { return x.node_id===n.node_id; }) || null;
  }

  function nodeState(n) {
    var r=verdictNode(n);
    if (r) {
      if (r.result==="ok") return n.kind==="C" ? "recovered" : "ok";
      return r.result;
    }
    if (state.seen[n.node_id]) return "seen";
    return "injected";
  }

  function nodeEvidence(n) {
    var r=verdictNode(n);
    if (!r) return (n.variant||"") + " · " + (n.node_type||"token");
    if (r.result==="skipped_by_capability") return "该腿不支持 " + (n.node_type||"token") + " 节点";
    if (n.kind==="M") {
      return "期望 " + (r.expected_code||"?") + (r.code ? " · 实测 "+r.code : "");
    }
    if (n.kind==="C") {
      var rec=state.shot["recovered.json"]||{};
      var rn=(rec.nodes||{})[n.node_id];
      if (rn) {
        return '<span title="expected '+esc(rn.expected||"")+' · actual '+esc(rn.actual||"")+'">' +
          (rn.ok ? chip("sha1 一致","ok") : chip("sha1 不一致","bad")) + '</span>';
      }
      return r.hash_ok===true ? chip("sha1 一致","ok") : (r.hash_ok===false ? chip("sha1 不一致","bad") : "—");
    }
    return r.status ? esc(r.status) : "—";
  }

  function renderAll() {
    el("snap-pill").textContent=state.snaps + " EVENTS";
    var nodeRows=(state.shot["manifest.json"] && state.shot["manifest.json"].nodes) || [];
    var kindOrder={T:0,M:1,C:2};
    function ko(k){ return kindOrder[k]===undefined?9:kindOrder[k]; }
    nodeRows=nodeRows.slice().sort(function (a,b) {
      var la=parseInt(String(a.leg||"").replace(/[^0-9]/g,""),10)||0;
      var lb=parseInt(String(b.leg||"").replace(/[^0-9]/g,""),10)||0;
      if (la!==lb) return la-lb;
      return ko(a.kind)-ko(b.kind);
    });
    var seenN=Object.keys(state.seen).length;
    var missing=0,tampered=0,unverified=0;
    if (state.verdict) {
      (state.verdict.nodes||[]).forEach(function (n) {
        if (n.result==="missing") missing++;
        if (n.result==="tampered" || n.result==="wrong_leg" || n.result==="mismatch") tampered++;
      });
      Object.keys(state.verdict.legs||{}).forEach(function (l) {
        var x=(state.verdict.legs[l]||{}).clean||{};
        if (x.unverified) unverified++;
      });
    }
    el("k-seen").textContent=seenN + " / " + nodeRows.length;
    el("k-missing").textContent=missing;
    el("k-tampered").textContent=tampered;
    el("k-unverified").textContent=unverified;
    var c=(state.verdict && state.verdict.canary) || (state.shot["verdict.json"]&&state.shot["verdict.json"].canary) || {};
    el("k-canary").textContent=(c.mutant_errors==null?"—":(c.mutant_errors+"/"+(c.expected_mutants||0)));
    var canaryEl=el("k-canary");
    if (state.verdict) {
      canaryEl.className="v " + (c.clean_errors ? "red" : (c.mutant_errors===(c.expected_mutants||0) ? "green" : "amber"));
    } else {
      canaryEl.className="v";
    }
    if (state.verdict) {
      setPill("overall-pill", state.verdict.overall || "—", state.verdict.overall==="PASS"?"ok":"bad");
      var note=el("banner");
      if (tampered) {
        note.className="banner red on";
        note.textContent="tampered/mismatch "+tampered+" · missing "+missing+" · unverified legs "+unverified;
      } else if (missing) {
        note.className="banner amber on";
        note.textContent="missing "+missing+" · unverified legs "+unverified;
      } else if (unverified) {
        note.className="banner amber on";
        note.textContent="unverified legs "+unverified+"（未验证，不伪装成通过）";
      } else if (state.verdict.overall==="PASS") {
        note.className="banner ok on"; note.textContent="节点已全部回收：T 全见、M 全报期望码、C 的 sha1 全部一致。可回工作台看 token 级证据。";
      } else {
        note.className="banner red on"; note.textContent="总判定 " + (state.verdict.overall||"BLOCK");
      }
    } else {
      setPill("overall-pill","运行中","warn");
    }
    el("nodes").innerHTML='<div class="table-wrap"><table><thead><tr><th>NODE</th><th>KIND</th><th>LEG</th><th>STATE</th><th>EVIDENCE</th></tr></thead><tbody>' +
      nodeRows.map(function (n) {
        var st=nodeState(n);
        return '<tr><td class="mono">'+esc(n.node_id)+'</td><td>'+chip(n.kind, n.kind==="M"?"warn":"ok")+'</td><td class="mono">'+esc(n.leg)+'</td><td><span class="node-state '+esc(st)+'">'+esc(st)+'</span></td><td class="small">'+nodeEvidence(n)+'</td></tr>';
      }).join("")+'</tbody></table></div>';

    var legs=Object.keys(state.leg).sort();
    el("matrix").innerHTML='<div class="table-wrap"><table><thead><tr><th>LEG</th><th>T/M/C</th><th>CHECKED</th><th>CLEAN ERR</th><th>MUT ERR</th><th>UNVERIFIED</th><th>N/A</th></tr></thead><tbody>' +
      legs.map(function (l) {
        var x=state.leg[l]; var vl=state.verdict && ((state.verdict.legs||{})[l]||{});
        var cv=vl && vl.clean; var mv=vl && vl.mutant;
        var cleanErr=cv ? (cv.error_n||0) : x.errClean;
        var mutErr=mv ? (mv.error_n||0) : x.errMut;
        var na=cv && cv.not_applicable; var unv=cv && cv.unverified;
        var mutCell=x.M ? chip(mutErr+"/"+x.M, mutErr===x.M ? "ok" : (mutErr>x.M ? "bad" : "warn")) : '<span class="muted">—</span>';
        var cleanCell=x.checked ? chip(String(cleanErr), cleanErr===0?"ok":"bad") : '<span class="muted">—</span>';
        return '<tr><td class="mono">'+esc(l)+'</td><td>'+x.T+'/'+x.M+'/'+x.C+'</td><td class="num">'+x.checked+'</td><td>'+cleanCell+'</td><td>'+mutCell+'</td><td>'+(unv?chip("unverified","unv"):"—")+'</td><td>'+(na?chip("N/A","na"):"—")+'</td></tr>';
      }).join("")+'</tbody></table></div>';

    el("events").innerHTML=state.events.slice().reverse().map(function (e) {
      var cls=e.status==="error" ? (e.variant==="mutant"?"err-mut":"err-clean") : "muted";
      var label=e.status==="error" ? (e.variant==="mutant"?"mut-err":"CLEAN ERR") : (e.status||"");
      return '<div class="ev"><span class="muted">'+esc(e.leg)+'</span><span class="muted">'+esc(e.variant)+'</span><span class="'+cls+'">'+esc(label)+'</span><span>'+esc(short(e.code ? (e.code+" · "+e.text) : e.text,90))+'</span></div>';
    }).join("") || '<div class="muted small">等待事件…</div>';
  }

  loadBatch().then(function () {
    var q=null; try { q=new URLSearchParams(location.search); } catch(e) {}
    var sid=q && q.get("sid");
